<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCNU Lo-Fi Generator | Web Edition</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            /* 1. 強制圖片自動放大、填滿整個螢幕，不留白 */
            background-size: cover;
            
            /* 2. 讓圖片上下左右都精準位置置中 */
            background-position: center;
            background-repeat: no-repeat;
            
            /* 3. 固定背景，不隨網頁滾動而移位 */
            background-attachment: fixed;
            
            /* 4. 切換場景時的滑順淡入淡出效果 */
            transition: background-image 0.7s ease-in-out;

            /* 5. 畫面維持置中、滿版高 */
            height: 100vh;
            margin: 0; /* 確保邊緣不會出現奇怪的白邊 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
        }

    .glass-card {
    /* ─── 核心修改：提高不透明度到 0.85 (接近實心)，並用高質感深色壓底 ─── */
        background: rgba(15, 23, 42, 0.85); 
    
    /* 讓背景被卡片擋住的地方有滑順的模糊效果 */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
    
    /* 淡淡的精緻邊框 */
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 30px;
    
    /* 加強外圍陰影，讓整張實心卡片在亮色背景前更有立體浮現感 */
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}
    </style>
</head>
<body>
    <div id="main-bg" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-size: cover; background-position: center; background-repeat: no-repeat; transition: background-image 0.7s ease-in-out; z-index: 0; background-image: url('./assets/night.gif');"></div>
    <div class="glass-card p-10 w-full max-w-md text-white text-center">
        <h1 class="text-3xl font-bold mb-8">Lo-Fi Generator</h1>

        <div class="mb-8 p-6 bg-black bg-opacity-20 rounded-2xl">
            <p class="text-[10px] uppercase tracking-tighter opacity-50 mb-1">Status / Mode</p>
            <h2 id="chord-display" class="text-2xl font-light tracking-wide">Initializing...</h2>
        </div>

        <div class="grid grid-cols-3 gap-3 mb-10">
            <button id="btn-midnight" class="border border-white/30 bg-black/20 hover:bg-white/20 py-3 rounded-xl transition text-sm">Midnight</button>
            <button id="btn-rainy" class="border border-white/30 bg-black/20 hover:bg-white/20 py-3 rounded-xl transition text-sm">Rainy</button>
            <button id="btn-cafe" class="border border-white/30 bg-black/20 hover:bg-white/20 py-3 rounded-xl transition text-sm">Cafe</button>
        </div>

        <div class="flex justify-center mt-8 mb-4">
            <button id="play-btn" class="bg-white text-gray-900 font-bold py-3 px-12 rounded-full shadow-lg hover:scale-105 transition">
                START
        </button>
        </div>
    </div>

    <audio id="audio-midnight" src="./assets/night.wav" loop></audio>
    <audio id="audio-rainy" src="./assets/rain.wav" loop></audio>
    <audio id="audio-cafe" src="./assets/cafe.wav" loop></audio>

    <py-config>
        packages = ["numpy"]
    </py-config>

    <script type="py" src="./pyscript_main.py?v=2"></script>

</body>
</html>
