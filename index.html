<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCNU Lo-Fi Generator | Web Edition</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="glass-card p-10 w-full max-w-md text-white text-center">
        <h1 class="text-3xl font-bold mb-8">Lo-Fi Generator</h1>

        <div class="mb-8 p-6 bg-black bg-opacity-20 rounded-2xl">
            <p class="text-[10px] uppercase tracking-tighter opacity-50 mb-1">Status / Mode</p>
            <h2 id="chord-display" class="text-2xl font-light tracking-wide">Initializing...</h2>
        </div>

        <div class="grid grid-cols-3 gap-3 mb-10">
            <button id="btn-midnight" class="border border-white/30 bg-white/10 hover:bg-white/20 py-3 rounded-xl transition text-sm">Midnight</button>
            <button id="btn-rainy" class="border border-white/30 bg-white/10 hover:bg-white/20 py-3 rounded-xl transition text-sm">Rainy</button>
            <button id="btn-cafe" class="border border-white/30 bg-white/10 hover:bg-white/20 py-3 rounded-xl transition text-sm">Cafe</button>
        </div>

        <div class="flex justify-center mt-8 mb-4">
            <button id="play-btn" class="bg-white text-gray-900 font-bold py-3 px-12 rounded-full shadow-lg hover:scale-105 transition">
                START
        </button>
        </div>
    </div>

    <py-config>
        packages = ["numpy"]
    </py-config>

    <script type="py" src="./pyscript_main.py"></script>

</body>
</html>
